name: Periodic health check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed service health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://part11-koj9.onrender.com/health
